# Serviço Cloud Run da API (`gcloud run services replace infra/cloud-run/service.yaml`).
#
# REGRAS DO DONO (2026-11-17) — não alterar sem autorização explícita:
#   * minScale = "0": scale-to-zero; o serviço nunca fica quente fora de uso;
#   * maxScale = "3": teto de instâncias;
#   * CPU só durante a requisição (cpu-throttling), 1 vCPU / 512 MiB.
# Região: `us-central1`, fixada em `deploy.sh` — o manifesto não carrega região.
# É a mesma região do dataset `panorama_serving` e do Artifact Registry.

# Staging é privado por IAM, SEM IAP (decisão D2 revisada pelo dono em
# 2026-11-23: login só quando o sistema for ao ar). Não há anotação
# `run.googleapis.com/iap-enabled` aqui de propósito: com a API do IAP
# desabilitada o serviço ficaria inacessível, e o gate é a policy de IAM do
# serviço (`roles/run.invoker` por pessoa). O runbook do IAP
# (`docs/iap-cloud-run.md`) fica para a fase de publicação.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: panorama-api
  annotations:
    run.googleapis.com/ingress: all
    # Autenticação exigida (sem `allUsers`/`--allow-unauthenticated`): a policy
    # de IAM do serviço é o gate e não é tocada pelo manifesto.
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      # Identidade da API: SA dedicada, IAM mínimo e sem chave JSON
      # (`infra/gcp/api-runtime-sa.yaml`, card `t_b44f8df1`). O ADC dentro do
      # container resolve para esta SA — nenhuma credencial vai na imagem.
      serviceAccountName: panorama-api-runtime@panorama-escola-staging.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 15
      containers:
        - name: api
          image: ${IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            # Nomes EXATOS dos aliases de `panorama_api.config.Settings`:
            # qualquer divergência é descartada por `extra="ignore"` e o valor
            # do manifesto deixa de valer (ver tests/unit/test_infra_config.py).
            - name: BQ_PROJECT
              value: panorama-escola-staging
            - name: BQ_DATASET
              value: panorama_serving
            - name: BQ_LOCATION
              value: us-central1
            - name: API_BQ_MAX_BYTES_BILLED
              value: "268435456"
            # Invalida o cache HTTP (ETag/LRU) a cada publicação de dados.
            - name: DATA_VERSION
              value: "${DATA_VERSION}"
            # Invalida o cache HTTP a cada deploy de código (card F8). Sem esta
            # variável o valor seria o default "dev" e um deploy novo não
            # invalidaria nada. `deploy.sh` exige a variável e a substitui.
            - name: APP_BUILD
              value: "${APP_BUILD}"
            # Anos do seletor das telas de mercado (card F5). Obrigatório: sem
            # esta variável o app falha no boot (mesma política de DATA_VERSION).
            # Só anos publicados; o maior é o padrão da tela.
            - name: APP_ANOS_DISPONIVEIS
              value: "2021,2022,2023,2024,2025"
