[project]
name = "panorama-api"
version = "0.1.0"
description = "API do Panorama Escola"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "google-cloud-bigquery>=3.27,<4",
    # Front SSR sob `/app` (card t_4370a4f1, decisão D1 = A). Única dependência
    # nova do front: templates renderizados no próprio processo da API.
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27",
    # parse dos manifestos IaC nos testes (infra/); já vem via uvicorn[standard],
    # declarado aqui para o teste não depender de dependência transitiva.
    "PyYAML>=6,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Templates, assets e dados estáticos do front (`/app`, cards t_4370a4f1 e
# t_f28d76a9) não são módulos Python: sem esta declaração um install não-editable
# sobe a API sem as telas e sem a lista de municípios.
panorama_api = ["web/templates/**/*.html", "web/static/*", "web/data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: exige credencial/rede do BigQuery; não roda por padrão",
    "dataset: testes que exigem dataset local (não rodam na camada hermética)",
]
